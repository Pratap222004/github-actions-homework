
name: Build Push and Scan

on:
  push:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image name
        id: image-name
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          echo "name=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, push and scan
        id: build
        uses: ./.github/actions/build-and-scan
        with:
          image_name: ${{ steps.image-name.outputs.name }}
          tag: ${{ github.sha }}
          dockerfile: ./Dockerfile
          context: .
          build_args: ""

      
      - name: Print image URI
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          echo "Pushed image: $IMAGE_URI"

